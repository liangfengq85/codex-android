name: Build CodeX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle 8.2
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Install build-tools (用于对齐与签名)
        run: sdkmanager "build-tools;34.0.0"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias codex -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CodeX, OU=CodeX, O=CodeX, L=Unknown, ST=Unknown, C=CN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-key-alias codex --ks-pass pass:android --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-release
          path: app/build/outputs/apk/release/app-release-signed.apk
