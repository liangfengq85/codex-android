name: Build CodeX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 新版 ubuntu runner 不再预装 sdkmanager，android-actions/setup-android@v3 会崩，
      # 改为手动安装 Google 官方 cmdline-tools 并加入 PATH（life-restart-app 同款已验证配方）
      - name: Setup Android cmdline-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            sudo mkdir -p "$SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
            sudo unzip -q /tmp/clt.zip -d "$SDK_ROOT/cmdline-tools"
            sudo mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          sdkmanager --version

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages (platform 34 + build-tools)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias codex -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CodeX, OU=CodeX, O=CodeX, L=Unknown, ST=Unknown, C=CN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-key-alias codex --ks-pass pass:android --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-release
          path: app/build/outputs/apk/release/app-release-signed.apk
