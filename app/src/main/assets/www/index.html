<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e1e" />
  <title>CodeX · 代码查看器</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btnToggleSidebar" class="btn-icon active" title="目录">☰</button>
      <div class="brand">⚡ CodeX</div>
      <div class="path" id="breadcrumb">未打开文件</div>
      <div class="actions">
        <button id="btnAdd" class="btn">＋</button>
        <button id="btnSearch" class="btn">🔍</button>
        <button id="btnProjects" class="btn">📁</button>
      </div>
    </header>

    <div class="body" id="bodyContainer">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">
          <button class="sidebar-hide-btn" id="btnHideSidebar" title="隐藏目录">◀</button>
          <span id="projName">项目</span>
        </div>
        <div id="treeView" class="tree"></div>
      </aside>

      <div class="resizer" id="resizer"><div class="resizer-handle"></div></div>

      <main class="main">
        <div id="welcome" class="welcome">
          <div class="welcome-card">
            <h1>⚡ CodeX</h1>
            <p>像 VS Code 一样浏览、搜索、编辑代码 —— 无需编译。</p>
            <button class="big-btn" id="btnAdd2">＋ 添加项目（选择文件夹）</button>
            <p class="tip" id="supportTip"></p>
          </div>
        </div>

        <div id="editorWrap" class="editor-wrap" style="display:none">
          <div class="tab-bar" id="tabBar"></div>
          <div class="editor-toolbar" id="editorToolbar">
            <button class="etool-btn" id="btnUndo" disabled title="撤回">↶</button>
            <button class="etool-btn" id="btnRedo" disabled title="重做">↷</button>
            <div class="etool-sep"></div>
            <button class="etool-btn" id="btnSaveEditor" disabled>💾 保存</button>
            <button class="etool-btn" id="btnCopyMenu" title="复制">📋</button>
            <div class="etool-spacer"></div>
            <span class="etool-info" id="editorInfo">—</span>
          </div>
          <div id="editorHost" class="editor-host"></div>
        </div>

        <div class="zoom-bar" id="zoomBar" style="display:none">
          <button class="zoom-btn" id="zoomOut">A−</button>
          <span class="zoom-size" id="zoomSize">13</span>
          <button class="zoom-btn" id="zoomIn">A+</button>
        </div>
      </main>
    </div>

    <!-- 统一搜索面板 -->
    <div class="searchpanel" id="searchPanel" style="display:none">
      <div class="sp-head">
        <div class="sp-mode-toggle">
          <button class="sp-mode-btn active" id="spModeFile">📄 当前文件</button>
          <button class="sp-mode-btn" id="spModeProject">📁 整个项目</button>
        </div>
        <button class="mini" id="searchClose">✕</button>
      </div>
      <div class="sp-search-row">
        <input id="searchInput" type="text" placeholder="搜索…" />
        <label class="cb"><input type="checkbox" id="searchCase" /> Aa</label>
        <button class="mini" id="searchPrev" title="上一个">↑</button>
        <button class="mini" id="searchNext" title="下一个">↓</button>
      </div>
      <div class="sp-stats" id="searchStats"></div>
      <div id="searchResults" class="sp-results"></div>
    </div>

    <!-- 复制弹窗 -->
    <div class="copy-popup" id="copyPopup" style="display:none">
      <div class="copy-popup-arrow"></div>
      <div id="copyPopupMain">
        <button class="copy-btn" data-action="all">📋 复制全部</button>
        <button class="copy-btn" data-action="selection">📋 复制选中区域</button>
        <button class="copy-btn" data-action="line">📋 复制当前行</button>
        <button class="copy-btn" data-action="range">📋 按行范围复制…</button>
      </div>
      <div id="copyPopupRange" style="display:none">
        <div class="copy-range-row">
          <span>行</span>
          <input type="number" id="copyStartLine" min="1" placeholder="起" />
          <span>—</span>
          <input type="number" id="copyEndLine" min="1" placeholder="止" />
          <button class="btn" id="copyRangeDo">复制</button>
        </div>
      </div>
    </div>

    <!-- 未保存提示弹窗 -->
    <div class="modal" id="unsavedModal" style="display:none">
      <div class="modal-box unsaved-box">
        <div class="modal-head">
          <span>⚠️ 未保存的修改</span>
        </div>
        <div class="unsaved-body">
          <p id="unsavedFileName">当前文件</p>
          <p>有未保存的修改，是否保存？</p>
        </div>
        <div class="unsaved-actions">
          <button class="btn" id="btnUnsavedSave">💾 保存</button>
          <button class="btn btn-warn" id="btnUnsavedDiscard">不保存</button>
          <button class="mini" id="btnUnsavedCancel">取消</button>
        </div>
      </div>
    </div>

    <!-- 项目列表弹窗 -->
    <div class="modal" id="projectsModal" style="display:none">
      <div class="modal-box">
        <div class="modal-head">
          <span>我的项目</span>
          <button class="mini" id="projectsClose">✕</button>
        </div>
        <div id="projectsList" class="projects-list"></div>
        <div class="modal-foot">
          <button class="btn" id="btnAdd3">＋ 添加项目</button>
        </div>
      </div>
    </div>

    <input type="file" id="dirInput" webkitdirectory directory multiple style="display:none" />
    <div id="toast" class="toast" style="display:none"></div>
  </div>

  <script src="js/highlight.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
